parallel:
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
    - model.visual
    - model.visual.blocks.{*}
    - model.language_model
    - model.language_model.embed_tokens
    - model.language_model.layers.{*}
    - lm_head
    - mtp
    param_dtype: bf16
    reduce_dtype: fp32
  ulysses_parallel_size: 1
data:
  dataset_param:
    dataset_type: huggingface
    attr:
      images: images
      messages: messages
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant
    preprocess_parameters:
      model_name_or_path: /workspace/tuzhitianwang/models/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64
    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: /workspace/tuzhitianwang/data/official_coco/extracted/dataset
      dataset: /workspace/tuzhitianwang/data/official_coco/extracted/dataset/annotations_slim.json
      cache_dir: /workspace/tuzhitianwang/qwen35_ascend_server_bundle/results/ascend_qwen35/runs/official_20260923_114123/cache
      overwrite_cache: false
      preprocessing_batch_size: 10
      preprocessing_num_workers: 1
      max_samples: 1000
  dataloader_param:
    pin_memory: true
    shuffle: false
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 0
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true
    enable_preload: false
model:
  model_id: qwen3_5
  model_name_or_path: /workspace/tuzhitianwang/models/Qwen3.5-0.8B
  trust_remote_code: true
features:
  recompute: true
  recompute_plan:
    apply_modules:
    - model.visual.blocks.{*}
    - model.language_model.layers.{*}
  enable_activation_offload: false
  activation_offload_plan:
    apply_modules:
    - model.visual.blocks.{*}
    - model.language_model.layers.{*}
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  seed: 42
  lr: 1.0e-05
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0
  train_iters: 100
  clip_grad: 0.0
  init_model_with_meta_device: false
  optimizer: adamw
  adam_fused: true
  save_interval: 100
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: ''
  use_deter_comp: false
  plugin:
  - mindspeed_mm/fsdp/models/qwen3_5
  - mindspeed_mm/fsdp/data/datasets/huggingface
  save: /workspace/tuzhitianwang/qwen35_ascend_server_bundle/results/ascend_qwen35/runs/hf_init_full_20260927_081557/checkpoints
  load_rank0_and_broadcast: false
tools:
  profile:
    enable: false
    profile_type: static
    ranks:
    - 0
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks:
    - 0
    stacks: all
    max_entries: null
    mem_info: false
